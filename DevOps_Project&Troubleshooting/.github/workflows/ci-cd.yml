name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r application/backend/requirements.txt
        pip install pytest

    - name: Run tests
      run: |
        cd application/backend
        pytest

    - name: Run Trivy vulnerability scanner in repo mode
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        format: 'table'
        severity: 'CRITICAL,HIGH'

    - name: Build Docker images
      run: |
        docker build -t taskboard-backend -f docker/backend.Dockerfile ./application/backend
        docker build -t taskboard-frontend -f docker/frontend.Dockerfile ./application/frontend
